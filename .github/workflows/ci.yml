name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-x86_64
            binary_suffix: ""
          - os: macos-latest
            target_label: macos-aarch64
            binary_suffix: ""
          - os: windows-latest
            target_label: windows-x86_64
            binary_suffix: ".exe"
    steps:
      - name: Checkout ao-promoter
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Checkout pinned supply-chain policy
        uses: actions/checkout@v7
        with:
          repository: uesugitorachiyo/ao-architecture
          ref: 45e75766dfe1eaf586a4e87259cbc44ae4b2ce7a
          path: .ao-supply-chain-policy

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/promoter ./cmd/promoter

      - name: Public safety scan
        if: matrix.os == 'ubuntu-latest'
        run: |
          pattern="ghp""_|github""_pat_|BEGIN ""RSA|BEGIN ""OPENSSH|ANTI""GRAVITY|private ""handoff|api""_key|access""_token"
          ! rg -n "$pattern" README.md docs examples internal cmd

      - name: Build native artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="target/native-artifacts/${{ matrix.target_label }}"
          binary="ao-promoter${{ matrix.binary_suffix }}"
          mkdir -p "$artifact_dir"
          go build -trimpath -o "$artifact_dir/$binary" ./cmd/promoter
          "$artifact_dir/$binary" --help > "$artifact_dir/help.txt"
          cp LICENSE NOTICE "$artifact_dir/"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact_dir/$binary" > "$artifact_dir/SHA256SUMS"
          else
            shasum -a 256 "$artifact_dir/$binary" > "$artifact_dir/SHA256SUMS"
          fi
          go env -json GOOS GOARCH GOVERSION > "$artifact_dir/go-env.json"
          go run .ao-supply-chain-policy/scripts/read_go_binary_metadata.go \
            "$artifact_dir/$binary" > "$artifact_dir/go-modules.json"
          source_sha="${GITHUB_SHA}"
          version="0.0.0+git.${source_sha:0:12}"
          generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dependency_lock=go.mod
          if [[ -f go.sum ]]; then
            dependency_lock=go.sum
          fi
          supply_chain_dir="$artifact_dir/supply-chain"
          archive="ao-promoter-${version}-${TARGET_LABEL}.tar.gz"
          python3 .ao-supply-chain-policy/scripts/build_go_supply_chain_candidate.py \
            --workspace-root . \
            --repository ao-promoter \
            --source-sha "$source_sha" \
            --version "$version" \
            --target "$TARGET_LABEL" \
            --binary "$artifact_dir/$binary" \
            --module-json "$artifact_dir/go-modules.json" \
            --dependency-lock "$dependency_lock" \
            --license LICENSE \
            --notice NOTICE \
            --archive-name "$archive" \
            --generated-at-utc "$generated_at_utc" \
            --out "$supply_chain_dir"
          python3 .ao-supply-chain-policy/scripts/verify_supply_chain_policy.py \
            --inventory .ao-supply-chain-policy/stack/distributable-inventory.json \
            --policy .ao-supply-chain-policy/stack/sbom-policy.json \
            --evidence "$supply_chain_dir/supply-chain-evidence.json" \
            --workspace-root . \
            --expected-source-sha "$source_sha" \
            --expected-version "$version" \
            --expected-target "$TARGET_LABEL" \
            --now "$generated_at_utc"
          go_version=$(go version | sed 's|"|\\"|g')
          cat > "$artifact_dir/native-artifact-summary.json" <<EOF
          {"command":"./cmd/promoter","entry_point":"ao-promoter","go_version":"${go_version}","publication_allowed":false,"release_upload_attempted":false,"repository":"ao-promoter","runner_os":"${RUNNER_OS}","schema_version":"ao.native-artifact-summary.v0.1","smoke":{"command":"--help","status":"passed"},"source_commit":"${GITHUB_SHA}","target_label":"${TARGET_LABEL}"}
          EOF
        env:
          TARGET_LABEL: ${{ matrix.target_label }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ao-promoter-native-artifact-${{ matrix.target_label }}-${{ github.sha }}
          path: target/native-artifacts/${{ matrix.target_label }}
